{% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
{% for c in form %}
    {% if c.is_hidden %}{{ c }}{% else %}
    <div class="mb-3">
        <label class="form-label" for="{{ c.id_for_label }}">{{ c.label }}</label>
        {{ c }}
        {% for e in c.errors %}<div class="text-danger small mt-1">{{ e }}</div>{% endfor %}
        {% if c.help_text %}<div class="form-text">{{ c.help_text|safe }}</div>{% endif %}
    </div>
    {% endif %}
{% endfor %}
