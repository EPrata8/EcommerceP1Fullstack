{% extends 'ecommerce/base.html' %}
{% block titulo %}Pedido realizado{% endblock %}

{% block content %}
<div class="conta painel text-center">
    <h1 class="h3 mb-3">Pedido #{{ pedido.pk }} realizado</h1>
    <p class="suave">Sua compra na loja {{ loja.nome }} foi registrada.</p>
    <div class="total mb-4">R$ {{ total_geral|floatformat:"2g" }}</div>
    <a href="{% url 'home' %}" class="btn btn-latao">Voltar para a loja</a>
</div>
{% endblock %}
